name: Windows release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      BLUELINK_PRODUCTION: "1"
      # Bump DATASET_REVISION to rebuild the article database from a fresher dump.
      DATASET_REVISION: "2026-08"
      DATASET_URL: https://dumps.wikimedia.org/enwiki/latest/enwiki-latest-pages-articles.xml.bz2
      # Raising this grows the shipped installer; the build needs at least 1,000,000.
      DATASET_ARTICLE_LIMIT: "2000000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Validate version and release credentials
        shell: pwsh
        run: |
          node tools/validate-version.mjs "$env:GITHUB_REF_NAME"
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBKEY)) { throw "Missing repository variable TAURI_UPDATER_PUBKEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Missing Actions secret TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "Missing Actions secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          node tools/write_release_config.mjs

      - name: Restore the production article database
        id: dataset
        uses: actions/cache/restore@v6
        with:
          path: data/production
          key: bluelink-dataset-${{ env.DATASET_REVISION }}-${{ env.DATASET_ARTICLE_LIMIT }}

      - name: Build the production article database
        if: steps.dataset.outputs.cache-hit != 'true'
        run: >
          python tools/build_dataset.py
          --dump "${{ env.DATASET_URL }}"
          --output data/production/articles.sqlite
          --production
          --limit ${{ env.DATASET_ARTICLE_LIMIT }}

      # Saved here rather than at job end so a later packaging failure does not
      # throw away half an hour of dump parsing.
      - name: Cache the production article database
        if: steps.dataset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/production
          key: bluelink-dataset-${{ env.DATASET_REVISION }}-${{ env.DATASET_ARTICLE_LIMIT }}

      - name: Test frontend
        run: npm run test

      - name: Test Windows backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish signed Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BlueLink v__VERSION__
          releaseBody: Download the BlueLink Windows installer below. Existing installations can update from inside the app.
          releaseDraft: false
          prerelease: false
          args: --config .release/tauri.release.conf.json
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
